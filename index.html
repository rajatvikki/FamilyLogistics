<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e293b">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; style-src 'self'; script-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Family Logistics</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div>
    <header>
      <h1>Family Logistics</h1>
      <button id="refreshButton" type="button">Refresh</button>
    </header>

    <div role="tablist" aria-label="Family Logistics views">
      <button id="todayTab" role="tab" aria-selected="true" aria-controls="todayPanel" type="button">Today</button>
      <button id="addTab" role="tab" aria-selected="false" aria-controls="addPanel" type="button">Add</button>
    </div>

    <section id="todayPanel" role="tabpanel" aria-labelledby="todayTab">
      <section>
        <h2 id="todayTitle">Today</h2>
        <div id="todayList">
          <div class="status-message">Loading today's plan...</div>
        </div>
      </section>

      <div class="plan-toolbar">
        <h2 id="planRangeTitle">Today &amp; Tomorrow</h2>
        <div class="plan-toggle" aria-label="Plan range">
          <button id="twoDaysButton" class="selected" type="button">2 days</button>
          <button id="weekButton" type="button">This week</button>
        </div>
      </div>
      <div id="eventsList">
        <div class="status-message">Loading schedule...</div>
      </div>
    </section>

    <section id="addPanel" role="tabpanel" aria-labelledby="addTab" class="hidden">
      <div class="form-header">
        <h2>Quick Add Activity</h2>
        <button id="resetPasscodeButton" type="button">Reset passcode</button>
      </div>

      <input type="date" id="eventDate" aria-label="Activity date">

      <div id="presetButtons">
        <button type="button" data-preset="Dad in Office">Dad in Office</button>
        <button type="button" data-preset="Mom in Office">Mom in Office</button>
        <button type="button" data-preset="Both Office">Both Office</button>
      </div>

      <section id="carpoolForm">
        <h3>Our Carpool Turn</h3>
        <div class="form-grid">
          <label>
            Trip
            <select id="carpoolTrip">
              <option value="Drop-off">Drop-off</option>
              <option value="Pick-up">Pick-up</option>
            </select>
          </label>
          <label>
            Driver
            <select id="carpoolDriver">
              <option value="Dad">Dad</option>
              <option value="Mom">Mom</option>
            </select>
          </label>
        </div>
        <label id="carpoolScheduleLabel">
          Schedule
          <select id="carpoolSchedule">
            <option value="day">Selected day only</option>
            <option value="week">Whole school week (Mon-Fri)</option>
          </select>
        </label>
        <div id="weeklyCarpoolDrivers" class="hidden">
          <label>Monday<select id="carpoolDriverMonday"><option>Dad</option><option>Mom</option></select></label>
          <label>Tuesday<select id="carpoolDriverTuesday"><option>Dad</option><option>Mom</option></select></label>
          <label>Wednesday<select id="carpoolDriverWednesday"><option>Dad</option><option>Mom</option></select></label>
          <label>Thursday<select id="carpoolDriverThursday"><option>Dad</option><option>Mom</option></select></label>
          <label>Friday<select id="carpoolDriverFriday"><option>Dad</option><option>Mom</option></select></label>
        </div>
        <button id="addCarpoolButton" type="button">Add Our Carpool Turn</button>
      </section>

      <section id="kidsActivityForm">
        <h3>Kids Activity</h3>
        <input type="text" id="kidsActivityName" placeholder="Activity name, e.g. Soccer">
        <div class="form-grid">
          <label>
            Schedule
            <select id="kidsActivitySchedule">
              <option value="day">Selected day only</option>
              <option value="weekly">Repeats every week</option>
            </select>
          </label>
          <label>
            Weekly day
            <select id="kidsActivityWeekday">
              <option value="MONDAY">Monday</option>
              <option value="TUESDAY">Tuesday</option>
              <option value="WEDNESDAY">Wednesday</option>
              <option value="THURSDAY">Thursday</option>
              <option value="FRIDAY">Friday</option>
              <option value="SATURDAY">Saturday</option>
              <option value="SUNDAY">Sunday</option>
            </select>
          </label>
        </div>
        <button id="addKidsActivityButton" type="button">Add Kids Activity</button>
      </section>

      <div id="customEntry">
        <input type="text" id="customNote" placeholder="Or type a custom note...">
        <button id="addCustomButton" type="button">Add</button>
      </div>
    </section>
  </div>
</body>
</html>
